databases:
  - name: fts-store-db
    databaseName: fts_store
    user: fts_user
    region: oregon
    plan: free

services:
  # ============================================================================
  # 1. FastAPI REST API Backend
  # ============================================================================
  - type: web
    name: fts-store-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/entrypoint.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fts-store-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: AUTO_BOOTSTRAP_ADMIN
        value: "true"
      - key: AUTO_SEED_DATA
        value: "true"
      - key: INITIAL_ADMIN_EMAIL
        value: admin@frndstech.com
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true

  # ============================================================================
  # 2. React + Vite Frontend (Static Site SPA)
  # ============================================================================
  - type: web
    name: fts-store-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: fts-store-backend
          envVarKey: RENDER_EXTERNAL_URL
