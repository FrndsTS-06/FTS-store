name: FTS Store CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-qa:
    name: Backend Lint, Migrations & Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fts_user
          POSTGRES_PASSWORD: fts_password
          POSTGRES_DB: fts_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Database Migrations
        env:
          DATABASE_URL: postgresql://fts_user:fts_password@localhost:5432/fts_test_db
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql://fts_user:fts_password@localhost:5432/fts_test_db
          SECRET_KEY: ci_pipeline_supersecret_jwt_key_testing
          ENVIRONMENT: testing
        run: |
          python -m pytest tests/ -v

  frontend-qa:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Vite Production Bundle
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          cd frontend
          npm run build
