version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fts_store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fts_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production_fts_2026}
      POSTGRES_DB: ${POSTGRES_DB:-fts_store_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fts_admin} -d $${POSTGRES_DB:-fts_store_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fts_internal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fts_store_backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-fts_admin}:${POSTGRES_PASSWORD:-change_me_in_production_fts_2026}@postgres:5432/${POSTGRES_DB:-fts_store_prod}
      AUTO_BOOTSTRAP_ADMIN: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fts_internal_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: fts_store_frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - fts_internal_net

networks:
  fts_internal_net:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
